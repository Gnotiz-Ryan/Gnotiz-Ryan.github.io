<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gnotiz! 的个人作品与联系方式。"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Gnotiz! | 个人链接</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="site-shell">
      <div class="ambient ambient--blue" aria-hidden="true"></div>
      <div class="ambient ambient--violet" aria-hidden="true"></div>

      <header class="site-header">
        <nav class="glass-nav" aria-label="主导航" data-glass-nav>
          <a class="avatar-link" href="#home" aria-label="返回 Gnotiz! 首页">
            <span class="avatar-mark" aria-hidden="true">G</span>
          </a>

          <ul class="nav-list">
            <li>
              <a
                class="nav-link is-active"
                href="#home"
                aria-current="page"
              >
                Gnotiz!
              </a>
            </li>
            <li>
              <button
                class="nav-link nav-link--pending"
                type="button"
                disabled
                title="作品内容将在下一步加入"
              >
                作品
              </button>
            </li>
            <li>
              <button
                class="nav-link nav-link--pending"
                type="button"
                disabled
                title="联系方式将在下一步加入"
              >
                联系我
              </button>
            </li>
          </ul>
        </nav>
      </header>

      <main id="home" class="page-canvas">
        <h1 class="sr-only">Gnotiz! 个人链接</h1>
      </main>

      <div class="page-markers" aria-hidden="true">
        <span class="page-marker page-marker--one"></span>
        <span class="page-marker page-marker--two"></span>
        <span class="page-marker page-marker--three"></span>
      </div>
    </div>
  </body>
</html>
